<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Exchange Log Report Angular</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Ctext%20x='1'%20y='23'%20font-size='23'%3EEX%3C/text%3E%3C/svg%3E">
  <script>
  (() => {
    const param = new URLSearchParams(window.location.search).get("scoutTheme");
    const theme =
      param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
  </script>
</head>
<body>
  <app-root><p>Opening the local portal...</p></app-root>
  <noscript>This portal requires JavaScript. CSV exports remain available in the report folder.</noscript>
</body>
</html>
